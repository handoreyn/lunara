name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (warnings as errors)
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: >
          dotnet test tests/Lunara.UnitTests/Lunara.UnitTests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory ./test-results

      - name: Run arch tests
        run: >
          dotnet test tests/Lunara.ArchTests/Lunara.ArchTests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=arch-tests.trx"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results/*.trx
          retention-days: 7
