# Local infrastructure for Lunara development.
# Prerequisites: Docker Desktop ≥ 4.x, Docker Compose v2.
#
# Usage (run from repository root):
#   cp infra/.env.example infra/.env          # first time only
#   docker compose -f infra/docker-compose.yml up -d --build
#
# Ports:
#   5432  → PostgreSQL
#   9092  → Kafka (host access)
#   5000  → Lunara.Api  (http://localhost:5000)
#   8080  → Kafka UI    (http://localhost:8080)
#
# All variables are loaded from the sibling .env file (git-ignored).

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: lunara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Zookeeper (required by Confluent Kafka) ───────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    container_name: lunara-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # ── Kafka ─────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: lunara-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"   # host access (application bootstrap servers)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PLAINTEXT_INTERNAL → container-to-container; PLAINTEXT → host access
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka UI (optional – comment out if not needed) ───────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: lunara-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ── Lunara API ────────────────────────────────────────────────────────────
  api:
    build:
      context: ..                                    # repository root
      dockerfile: src/Platform/Lunara.Api/Dockerfile
    container_name: lunara-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      DatabaseOptions__ConnectionString: "Host=postgres;Port=5432;Database=lunara;Username=lunara;Password=lunara"
      KafkaOptions__BootstrapServers: "kafka:29092"
      KafkaOptions__TopicPrefix: "lunara."

  # ── Lunara Worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: ..                                       # repository root
      dockerfile: src/Platform/Lunara.Worker/Dockerfile
    container_name: lunara-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DatabaseOptions__ConnectionString: "Host=postgres;Port=5432;Database=lunara;Username=lunara;Password=lunara"
      KafkaOptions__BootstrapServers: "kafka:29092"
      KafkaOptions__TopicPrefix: "lunara."

volumes:
  postgres_data:
