# Promtail configuration for local development.
# Discovers running Docker containers via the Docker socket and ships
# their stdout/stderr to Loki.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        # Only ship logs from containers that belong to this compose project.
        filters:
          - name: label
            values: ["com.docker.compose.project=lunara"]
    relabel_configs:
      # Strip the leading slash from the container name (e.g. /lunara-api → lunara-api).
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      # Expose the compose service name as a label for easy filtering in Grafana.
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      # Expose stdout vs stderr stream.
      - source_labels: [__meta_docker_container_log_stream]
        target_label: logstream
      # Keep the container image for context.
      - source_labels: [__meta_docker_container_image_name]
        target_label: image
