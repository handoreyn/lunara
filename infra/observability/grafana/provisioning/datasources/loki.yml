# Automatically provisions the Loki datasource in Grafana on first start.
# Grafana picks this up from /etc/grafana/provisioning/datasources.

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
